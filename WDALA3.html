<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Tracker</title>
  <style>
    /* ====== Global Styles ====== */
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7fb;
      color: #333;
    }

    /* ====== Navbar ====== */
    .navbar {
      background-color: #2c3e50;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }
    .navbar h1 {
      margin: 0;
      font-size: 20px;
    }
    .navbar a {
      color: #ecf0f1;
      margin-left: 20px;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
    }
    .navbar a:hover {
      color: #1abc9c;
    }

    /* ====== Container ====== */
    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
    }

    /* ====== Headings ====== */
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 15px;
    }
    h3 {
      margin-bottom: 10px;
      color: #34495e;
    }

    /* ====== User Info ====== */
    .user-info p {
      margin: 8px 0;
      font-size: 16px;
    }
    .total-expense {
      font-size: 22px;
      font-weight: bold;
      color: #e74c3c;
    }

    /* ====== Form ====== */
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #bdc3c7;
      outline: none;
      transition: border-color 0.3s;
    }
    .form-group input:focus {
      border-color: #1abc9c;
    }
    .btn {
      background: #1abc9c;
      color: white;
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.3s;
    }
    .btn:hover {
      background: #16a085;
    }

    /* ====== Expense Summary ====== */
    .expense-summary {
      min-height: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #7f8c8d;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <h1>Finance Tracker</h1>
    <div>
      <a href="#">Home</a>
      <a href="#">Add Expense</a>
      <a href="#">Summary</a>
    </div>
  </div>

  <!-- Container -->
  <div class="container">

    <!-- Welcome Section -->
    <div class="card">
      <h2>Welcome to Personal Finance Tracker</h2>
      <p style="text-align: center;">Track your daily expenses and stay in control of your money.</p>
      <div class="user-info">
        <p class="total-expense">Your Total Expenses: ₹0</p>
        <p><b>Name:</b> Baxi Aditya</p>
        <p><b>Enrollment No:</b> 240905040010</p>
      </div>
    </div>

    <!-- Add Expense Section -->
    <div class="card">
      <h2>Add Expense</h2>
      <form>
        <div class="form-group">
          <label for="title">Expense Title</label>
          <input type="text" id="title" placeholder="Enter expense title">
        </div>
        <div class="form-group">
          <label for="amount">Amount (₹)</label>
          <input type="number" id="amount" placeholder="Enter amount">
        </div>
        <button type="button" class="btn">Add Expense</button>
      </form>
    </div>

    <!-- Expense Summary Section -->
    <div class="card">
      <h2>Expense Summary</h2>
      <div class="expense-summary">
        No expenses added yet.
      </div>
    </div>

  </div>

</body>
</html>
